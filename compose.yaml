services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: roya
      POSTGRES_USER: roya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - roya_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roya -d roya"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  roya_postgres:
