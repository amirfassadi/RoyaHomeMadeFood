name: Quality and PostgreSQL integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: roya_test
          POSTGRES_PASSWORD: test_only_not_a_production_secret
          POSTGRES_DB: roya_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U roya_test -d roya_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://roya_test:test_only_not_a_production_secret@localhost:5432/roya_test
      DIRECT_URL: postgresql://roya_test:test_only_not_a_production_secret@localhost:5432/roya_test
      ROYA_INTEGRATION_DATABASE_URL: postgresql://roya_test:test_only_not_a_production_secret@localhost:5432/roya_test
      ROYA_DEMO_CATALOG: '0'
      ROYA_INDEXABLE: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Record pinned operator source archive digest
        env:
          ROYA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl --proto '=https' --fail --location --retry 1 \
            --connect-timeout 10 --max-time 90 \
            -o "$RUNNER_TEMP/roya-source.tar.gz" \
            "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$ROYA_SOURCE_COMMIT"
          printf 'ROYA_SOURCE_COMMIT=%s\n' "$ROYA_SOURCE_COMMIT"
          sha256sum "$RUNNER_TEMP/roya-source.tar.gz"
      - name: Check operational script syntax
        run: |
          python3 -m py_compile deploy/inspect-amir-disk.py deploy/inspect-offline-cache.py deploy/offline-build-inputs.py
          for roya_script in deploy/*.sh; do
            bash -n "$roya_script"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify offline input integrity and real cache seeding
        run: python3 scripts/test-offline-build.py
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - name: Verify administrator diagnostic boundaries and secret redaction
        run: node --test scripts/test-admin-diagnostics.mjs scripts/test-domain-admin-diagnostics.mjs scripts/test-storefront-data-check.mjs
      - name: Verify domain rollback and native DNS/web configuration
        run: |
          python3 -m py_compile deploy/final-readiness.py
          python3 scripts/test-domain-build-cleanup.py
          sudo python3 scripts/test-domain-preparation.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx-light bind9-utils bind9-dnsutils
          sudo python3 scripts/test-domain-native.py
          sudo python3 scripts/test-domain-tls.py
          sudo python3 scripts/test-domain-origin.py
          sudo python3 scripts/test-domain-upgrade.py
          sudo python3 scripts/test-domain-access.py
          python3 scripts/test-domain-dns-native.py
          sudo python3 scripts/test-domain-tls-native.py
      - run: npm run test:integration
      - name: Reproduce VPS cache and verify offline install build and HTTP guards
        timeout-minutes: 5
        run: python3 scripts/test-offline-build.py --integration
      - name: Build VPS application
        run: npm run build:app
        env:
          ROYA_DEPLOYMENT_ROLE: standalone
          ROYA_PRIVATE_DB_CATALOG: '1'
          ROYA_DEMO_CATALOG: '1'
          ROYA_LIVE_PAYMENTS: '0'
          ROYA_ACCEPT_ORDERS: '0'
          ROYA_SEND_SMS: '0'
      - name: Install isolated browser
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/roya-browser-test" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/roya-browser-test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify administrator forms in an isolated browser
        timeout-minutes: 3
        run: |
          ROYA_TEST_BROWSER_MODULE="$RUNNER_TEMP/roya-browser-test/node_modules/playwright" node scripts/test-admin-duration.mjs
          ROYA_TEST_BROWSER_MODULE="$RUNNER_TEMP/roya-browser-test/node_modules/playwright" node --import tsx scripts/test-admin-content.mjs
      - name: Verify responsive bilingual header and mobile navigation
        timeout-minutes: 3
        run: ROYA_TEST_BROWSER_MODULE="$RUNNER_TEMP/roya-browser-test/node_modules/playwright" node scripts/test-header-browser.mjs
      - name: Verify guest checkout and simulated mobile recovery in an isolated browser
        timeout-minutes: 3
        run: ROYA_TEST_BROWSER_MODULE="$RUNNER_TEMP/roya-browser-test/node_modules/playwright" node scripts/test-storefront-browser.mjs
      - name: Verify rate failures and administrator pricing drafts across browser tabs
        timeout-minutes: 3
        run: ROYA_TEST_BROWSER_MODULE="$RUNNER_TEMP/roya-browser-test/node_modules/playwright" node --import tsx scripts/test-pricing-rates-browser.mjs
      - name: Verify administrator HTTP flow against isolated PostgreSQL
        run: |
          bash -n deploy/recover-vps-admin.sh
          bash -n deploy/test-vps-pricing.sh
          bash scripts/test-admin-http.sh
      - name: Verify private HTTPS domain application and secure administrator session
        run: |
          mv .next "$RUNNER_TEMP/roya-loopback-app-build"
          npm run build:app
          mkdir -p .next/standalone/.next
          cp -a public .next/standalone/
          cp -a .next/static .next/standalone/.next/
          sudo env PATH="$PATH" ROYA_INTEGRATION_DATABASE_URL="$ROYA_INTEGRATION_DATABASE_URL" python3 scripts/test-domain-origin-native.py
        env:
          ROYA_DEPLOYMENT_ROLE: standalone
          ROYA_PRIVATE_DB_CATALOG: '1'
          ROYA_DEMO_CATALOG: '1'
          ROYA_LIVE_PAYMENTS: '0'
          ROYA_ACCEPT_ORDERS: '0'
          ROYA_SEND_SMS: '0'
          NEXTAUTH_URL: https://royahealthyfood.ir
          NEXT_PUBLIC_SITE_URL: https://royahealthyfood.ir
      - name: Verify backup and isolated restore
        run: python3 scripts/test-backup-restore.py
        env:
          ROYA_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: Build static preview separately
        run: |
          mv .next "$RUNNER_TEMP/roya-app-build"
          npm run build:sites
        env:
          ROYA_DEMO_CATALOG: '1'
      - name: Audit locked dependencies
        run: npm audit --audit-level=high --fetch-timeout=30000 --fetch-retries=1
