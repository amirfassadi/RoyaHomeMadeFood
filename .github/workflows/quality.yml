name: Quality and PostgreSQL integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: roya_test
          POSTGRES_PASSWORD: test_only_not_a_production_secret
          POSTGRES_DB: roya_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U roya_test -d roya_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://roya_test:test_only_not_a_production_secret@localhost:5432/roya_test
      DIRECT_URL: postgresql://roya_test:test_only_not_a_production_secret@localhost:5432/roya_test
      ROYA_INTEGRATION_DATABASE_URL: postgresql://roya_test:test_only_not_a_production_secret@localhost:5432/roya_test
      ROYA_DEMO_CATALOG: '0'
      ROYA_INDEXABLE: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - name: Verify administrator diagnostic boundaries and secret redaction
        run: node --test scripts/test-admin-diagnostics.mjs
      - run: npm run test:integration
      - name: Build VPS application
        run: npm run build:app
        env:
          ROYA_DEPLOYMENT_ROLE: standalone
          ROYA_LIVE_PAYMENTS: '0'
          ROYA_ACCEPT_ORDERS: '0'
          ROYA_SEND_SMS: '0'
      - name: Verify administrator HTTP flow against isolated PostgreSQL
        run: |
          bash -n deploy/recover-vps-admin.sh
          bash scripts/test-admin-http.sh
      - name: Verify backup and isolated restore
        run: python3 scripts/test-backup-restore.py
        env:
          ROYA_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: Build static preview separately
        run: |
          mv .next "$RUNNER_TEMP/roya-app-build"
          npm run build:sites
        env:
          ROYA_DEMO_CATALOG: '1'
